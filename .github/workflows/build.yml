name: Build BlazorCalc

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BlazorWasm/BlazorWasm.csproj

      - name: Build
        run: dotnet build BlazorWasm/BlazorWasm.csproj --no-restore --configuration Release
