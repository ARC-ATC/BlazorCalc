<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="A fast, accessible exam time calculator for standard and extra-time accommodations." />
    <title>Exam Time Calculator</title>
    <base href="/BlazorCalc/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="BlazorWasm.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="app-loading" role="status" aria-live="polite">
            <div class="loading-mark" aria-hidden="true"></div>
            <span>Loading ExamTime…</span>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <div>
            <strong>Something went wrong.</strong>
            <span>Reload the page to continue.</span>
        </div>
        <a href="" class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
